<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход в аккаунт</title>
<style>
  :root{
    --accent:#a855f7; --accent-2:#7c3aed;
    --text:#e9e5f7; --dim:#9d94b8; --red:#ff5b7a;
    --glass:rgba(22,17,40,.72); --glass-brd:rgba(168,85,247,.28);
    --ui:'Trebuchet MS',Verdana,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--ui);color:var(--text);overflow:hidden;
    background:radial-gradient(120% 90% at 50% 8%,#160f33 0%,#0b0918 55%,#050410 100%);}
  #bg{position:fixed;inset:0;z-index:0;display:block;}
  .box{position:relative;z-index:1;width:360px;padding:28px 26px 24px;
    background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
    -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 24px 60px rgba(0,0,0,.6);}
  h1{font-size:17px;font-weight:800;letter-spacing:3px;
    color:#fff;text-align:center;margin:0 0 4px;text-shadow:0 0 18px rgba(168,85,247,.6);}
  .sub{font-size:13px;color:var(--dim);text-align:center;margin-bottom:20px;letter-spacing:1px;}
  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px;letter-spacing:.5px;font-weight:600;}
  input{width:100%;padding:11px 13px;background:rgba(10,8,20,.6);border:1px solid var(--glass-brd);
    border-radius:10px;color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:.15s;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.18);}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;text-align:center;}
  .row{display:flex;gap:10px;margin-top:16px;}
  button{flex:1;position:relative;overflow:hidden;padding:12px;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.5px;
    border:1px solid rgba(200,147,255,.55);color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 6px 20px rgba(124,58,237,.35);
    transition:transform .12s cubic-bezier(.34,1.6,.64,1),box-shadow .2s;}
  button:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(124,58,237,.45);}
  button:active{transform:scale(.96);}
  button.ghost{background:rgba(255,255,255,.05);border-color:var(--glass-brd);color:var(--text);}
  button.ghost:hover{border-color:var(--accent);}
  button:disabled{opacity:.6;cursor:default;transform:none;}
  .note{font-size:11px;color:var(--dim);text-align:center;margin-top:14px;opacity:.55;letter-spacing:.3px;}
  /* «бульк» по воде при нажатии — как в лаунчере */
  .jv-ripple{position:absolute;width:0;height:0;transform:translate(-50%,-50%);pointer-events:none;}
  .jv-ripple i{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.55);transform:rotate(45deg);opacity:0;
    animation:jvRipple 1.05s cubic-bezier(.22,.61,.36,1) forwards;}
  .jv-ripple i:nth-child(2){animation-delay:.12s;}
  .jv-ripple i:nth-child(3){animation-delay:.24s;}
  @keyframes jvRipple{from{transform:scale(.25);opacity:.6;}to{transform:scale(6);opacity:0;}}
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="box">
    <h1>ВХОД В ИГРУ</h1>
    <div class="sub">JavelinMC</div>

    <label>Логин или e-mail</label>
    <input id="u" type="text" autocomplete="username" autofocus>

    <label>Пароль</label>
    <input id="p" type="password" autocomplete="current-password">

    <div class="err" id="err"></div>

    <div class="row">
      <button class="ghost" id="cancel">Отмена</button>
      <button id="go">Войти</button>
    </div>

    <div class="note">аккаунт Ely.by</div>
  </div>

  <script>
    // фон: медленный полёт сквозь звёзды, как в лаунчере
    (function(){
      var cv=document.getElementById("bg"), ctx=cv.getContext("2d");
      if(!ctx)return;
      var DPR=Math.min(window.devicePixelRatio||1,2), cx=0, cy=0, maxR=1, stars=[];
      function mk(spread){ return {a:Math.random()*Math.PI*2, r:spread?Math.random()*maxR:Math.random()*6, spd:.5+Math.random()*1.1}; }
      function size(){
        cv.width=Math.max(2,Math.floor(innerWidth*DPR)); cv.height=Math.max(2,Math.floor(innerHeight*DPR));
        cx=cv.width/2; cy=cv.height/2; maxR=Math.sqrt(cx*cx+cy*cy);
        var n=Math.max(90,Math.min(260,Math.round(cv.width*cv.height/3200)));
        while(stars.length<n)stars.push(mk(true));
        if(stars.length>n)stars.length=n;
      }
      size(); addEventListener("resize",size);
      (function step(){
        ctx.clearRect(0,0,cv.width,cv.height); ctx.lineCap="round";
        for(var i=0;i<stars.length;i++){
          var s=stars[i], pr=s.r;
          s.r+=(s.r*.015+.35)*s.spd*DPR;
          if(s.r>maxR){ stars[i]=mk(false); continue; }
          var ca=Math.cos(s.a), sa=Math.sin(s.a), t=s.r/maxR;
          ctx.strokeStyle="rgba("+(175+((t*80)|0))+","+(140+((t*90)|0))+",255,"+Math.min(1,.14+t*1.05).toFixed(3)+")";
          ctx.lineWidth=Math.max(.6,t*t*2.6*DPR);
          ctx.beginPath(); ctx.moveTo(cx+ca*pr,cy+sa*pr); ctx.lineTo(cx+ca*s.r,cy+sa*s.r); ctx.stroke();
        }
        requestAnimationFrame(step);
      })();
    })();

    // «бульк» на кнопках
    document.addEventListener("pointerdown",function(e){
      var b=e.target.closest("button"); if(!b)return;
      var r=b.getBoundingClientRect(), s=document.createElement("span"); s.className="jv-ripple";
      for(var k=0;k<3;k++)s.appendChild(document.createElement("i"));
      s.style.left=(e.clientX-r.left)+"px"; s.style.top=(e.clientY-r.top)+"px";
      b.appendChild(s); setTimeout(function(){s.remove();},1400);
    },true);

    const u=document.getElementById("u"), p=document.getElementById("p"),
          err=document.getElementById("err"), go=document.getElementById("go"), cancel=document.getElementById("cancel");

    function submit(){
      err.textContent="";
      const un=u.value.trim(), pw=p.value;
      if(!un||!pw){ err.textContent="Введите логин и пароль."; return; }
      go.disabled=true; go.textContent="Вход…";
      window.ely.submit(un, pw);
    }
    go.addEventListener("click", submit);
    p.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    u.addEventListener("keydown", e=>{ if(e.key==="Enter") p.focus(); });
    cancel.addEventListener("click", ()=>window.ely.cancel());

    window.ely.onError(m=>{
      err.textContent = m || "Не удалось войти.";
      go.disabled=false; go.textContent="Войти";
    });
  </script>
</body>
</html>
