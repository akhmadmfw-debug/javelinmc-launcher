# Собирает установщик для macOS (.dmg) на настоящей маковской машине GitHub.
#
# Почему только macOS. Windows-версию мы собираем у себя: в неё вложена Java 17,
# а один её файл весит 122 МБ — GitHub не принимает файлы больше 100 МБ, и в
# репозиторий эта папка просто не поместится. Маковской сборке она не нужна:
# там Java скачивается сама при первом запуске игры.
#
# Запуск: вкладка Actions -> «Сборка для macOS» -> Run workflow.

name: Сборка для macOS

on:
  workflow_dispatch:          # запуск кнопкой из вкладки Actions
  push:
    tags: ["v*"]              # ...или сам, если поставить метку вида v1.0.45

jobs:
  mac:
    name: macOS (Intel и Apple Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # config.json в репозитории нет — там ключ CurseForge. Достаём его из
      # секрета репозитория (Settings -> Secrets and variables -> Actions).
      - name: Подготовить config.json
        env:
          JV_CONFIG: ${{ secrets.JV_CONFIG }}
        run: |
          if [ -z "$JV_CONFIG" ]; then
            echo "::error::Не задан секрет JV_CONFIG — положите в него содержимое config.json"
            exit 1
          fi
          printf '%s' "$JV_CONFIG" > config.raw
          # Приводим в порядок то, что вставили руками: убираем метку кодировки
          # в начале (её любит добавлять блокнот), виндовые переводы строк и
          # пустоту по краям. Без этого разбор JSON спотыкается на первом же знаке.
          node -e '
            const fs = require("fs");
            let t = fs.readFileSync("config.raw", "utf8");
            t = t.replace(/^﻿/, "").replace(/\r/g, "").trim();
            try {
              const c = JSON.parse(t);
              fs.writeFileSync("config.json", JSON.stringify(c, null, 2));
              console.log("config.json на месте, полей: " + Object.keys(c).length);
            } catch (e) {
              // Само содержимое не печатаем — это ключи. Только приметы.
              console.log("::error::Секрет JV_CONFIG не читается как JSON. " +
                "Длина " + t.length + " знаков, начинается на «" + t.slice(0, 1) + "», " +
                "заканчивается на «" + t.slice(-1) + "». Ошибка разбора в знаке " +
                (String(e.message).match(/position (\\d+)/) || [,"?"])[1] + ".");
              console.log("::error::Проверьте, что в секрет вставлено ВСЁ содержимое файла " +
                "config.json — от открывающей { до закрывающей }, без кавычек вокруг.");
              process.exit(1);
            }
          '
          rm -f config.raw

      - name: Поставить зависимости
        run: npm ci

      - name: Собрать .dmg
        run: npx electron-builder --mac --publish never
        env:
          # Сертификата Apple у нас нет — просим сборщик не искать его и не
          # тратить на это время. Приложение выйдет неподписанным: игрок при
          # первом запуске откроет его правой кнопкой -> «Открыть».
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Показать, что получилось
        run: ls -lh dist/*.dmg

      - name: Забрать готовые файлы
        uses: actions/upload-artifact@v4
        with:
          name: JavelinMC-macOS
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
